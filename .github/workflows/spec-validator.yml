name: Spec Validator

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  changed-specs:
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.changes.outputs.specs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find affected specs
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess

          # Disable rename detection so both sides of a move affect selection.
          changed = subprocess.check_output([
              "git", "diff", "--name-only", "--no-renames", "-z",
              f"{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}",
          ]).decode().split("\0")
          sources = sorted([
              *Path(".").glob("index.html"),
              *Path(".").glob("*/index.html"),
          ])
          # Shared includes/scripts and validator changes affect every spec.
          validate_all = any(
              path.startswith("common/")
              or path == ".github/workflows/spec-validator.yml"
              for path in changed
          )
          specs = []
          for source in sources:
              is_root = source.parent == Path(".")
              prefix = "img/" if is_root else f"{source.parent}/"
              if validate_all or str(source) in changed or any(
                  path.startswith(prefix) for path in changed
              ):
                  specs.append({
                      "source": str(source),
                      "name": "aria" if is_root else source.parent.name,
                  })
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"specs={json.dumps(specs)}\n")

  validate:
    needs: changed-specs
    if: needs.changed-specs.outputs.specs != '[]'
    name: Validate ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changed-specs.outputs.specs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate markup and Web IDL
        uses: w3c/spec-prod@v2
        with:
          TOOLCHAIN: respec
          SOURCE: ${{ matrix.source }}
          VALIDATE_MARKUP: true
          VALIDATE_WEBIDL: true
          ARTIFACT_NAME: spec-validator-${{ matrix.name }}
